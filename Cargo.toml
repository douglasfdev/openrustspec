[package]
name = "openrustspec"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0.18"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"


[lib]
name = "openrustspec"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.3"